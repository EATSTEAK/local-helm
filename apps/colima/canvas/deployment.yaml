apiVersion: apps/v1
kind: Deployment
metadata:
  name: canvas
  namespace: default
  labels:
    app: canvas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canvas
  template:
    metadata:
      labels:
        app: canvas
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: canvas
          image: canvas-koohyomin:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PUBLIC_BASE_URL
              value: https://canvas.koohyom.in
            - name: DATA_DIR
              value: /data
            - name: MAX_BODY_BYTES
              value: "5242880"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: canvas-data
