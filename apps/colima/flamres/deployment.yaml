apiVersion: apps/v1
kind: Deployment
metadata:
  name: flamres
  namespace: flamres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flamres
  template:
    metadata:
      labels:
        app: flamres
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      containers:
        - name: bot
          image: flamres:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: flamres-config
            - secretRef:
                name: flamres-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node/.local
            - name: opencode-workdir
              mountPath: /workspace
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: flamres-opencode-data
        - name: opencode-workdir
          persistentVolumeClaim:
            claimName: flamres-workdir
