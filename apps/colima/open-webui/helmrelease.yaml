apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 10m0s
  releaseName: open-webui
  targetNamespace: open-webui
  chart:
    spec:
      chart: open-webui
      interval: 10m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      version: 15.2.0
  valuesFrom:
    - kind: ConfigMap
      name: open-webui-values
      valuesKey: values.yaml
