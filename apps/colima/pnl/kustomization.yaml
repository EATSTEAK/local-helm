apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pnl
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pnl-values
    files:
      - values.yaml=pnl-values.yaml
  - name: pnl-deps-values
    files:
      - values.yaml=pnl-deps-values.yaml
resources:
  - namespace.yaml
  - helmrelease-pnl-deps.yaml
  - helmrelease-pnl.yaml

