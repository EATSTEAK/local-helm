namespace: pnl

postgres:
  image:
    repository: timescale/timescaledb
    tag: 2.17.2-pg16
    pullPolicy: IfNotPresent
  database: pnl
  username: pnl
  password: pnl-local-password
  passwordSecretName: pnl-postgres
  passwordSecretKey: password
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

runtimeSecret:
  name: pnl-runtime-secrets
  emailIngestHmacSecret: pnl-local-hmac-secret
  debankApiKey: ""
  ccxtExchangeCredentialsJson: "[]"
