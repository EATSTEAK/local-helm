namespace: sake
image:
  repository: ghcr.io/triflam/sake-studio
  tag: main-d080a18
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-auth
secretRefs:
  - name: sake-dev-secrets
    optional: false
  - name: sake-runtime-secrets
    optional: false
config:
  # Interactive workflows are restricted to this authenticated development deployment.
  NODE_ENV: development
  MASTRA_HOST: "0.0.0.0"
  LLM_BASE_URL: http://host.docker.internal:8317/v1
  LLM_MODEL: gpt-5.6-terra
  LLM_TIMEOUT_MS: "6000000"
  EMBEDDING_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
  EMBEDDING_MODEL: gemini-embedding-2
  EMBEDDING_DIMENSIONS: "1536"
  OBJECT_STORE_ENDPOINT: sake-minio
  OBJECT_STORE_PORT: "9000"
  OBJECT_STORE_USE_SSL: "false"
  OBJECT_STORE_BUCKET: sake-dev
  CRAWL4AI_BASE_URL: http://sake-crawl4ai:11235
  RESEARCH_CRAWL_ENABLED: "true"
  RESEARCH_SEARCH_ENABLED: "true"
  RESEARCH_SEARCH_PROVIDER: none
ingress:
  enabled: true
  className: nginx
  host: studio-sake.koohyom.in
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: 9b1820c5-3168-4638-a1f0-9fe1585eda94.cfargotunnel.com
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: sake-studio-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
