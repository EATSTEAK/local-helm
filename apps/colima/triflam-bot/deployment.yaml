apiVersion: apps/v1
kind: Deployment
metadata:
  name: triflam-bot
  namespace: triflam-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triflam-bot
  template:
    metadata:
      labels:
        app: triflam-bot
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      containers:
        - name: bot
          image: triflam-bot:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: triflam-bot-config
            - secretRef:
                name: triflam-bot-secrets
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: opencode-data
              mountPath: /home/node/.local
            - name: opencode-workdir
              mountPath: /workspace
      volumes:
        - name: opencode-data
          persistentVolumeClaim:
            claimName: triflam-bot-opencode-data
        - name: opencode-workdir
          persistentVolumeClaim:
            claimName: triflam-bot-workdir
