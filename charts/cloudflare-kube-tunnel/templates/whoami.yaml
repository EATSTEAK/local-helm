{{- if .Values.sample.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.sample.name }}
  namespace: {{ .Values.sample.namespace }}
  labels:
    {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sample.replicas }}
  selector:
    matchLabels:
      {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Values.sample.name }}
          image: "{{ .Values.sample.image.repository }}:{{ .Values.sample.image.tag }}"
          imagePullPolicy: {{ .Values.sample.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.sample.name }}
  namespace: {{ .Values.sample.namespace }}
  labels:
    {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.sample.service.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.sample.name }}
  namespace: {{ .Values.sample.namespace }}
  labels:
    {{- include "cloudflare-kube-tunnel.sampleLabels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.tunnel.target | quote }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.sample.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.sample.name }}
                port:
                  number: {{ .Values.sample.service.port }}
{{- end }}
