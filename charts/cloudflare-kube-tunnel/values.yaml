domain: koohyom.in

tunnel:
  name: colima-k8s-koohyomin
  id: 9b1820c5-3168-4638-a1f0-9fe1585eda94
  target: 9b1820c5-3168-4638-a1f0-9fe1585eda94.cfargotunnel.com

cloudflareTunnelCredentials:
  create: false
  namespace: cloudflare-tunnel
  name: cloudflare-tunnel-credentials
  credentialsJson: ""

externalDnsToken:
  create: false
  namespace: external-dns
  name: cloudflare-api-token
  apiToken: ""

sample:
  enabled: true
  name: whoami
  namespace: default
  hostname: whoami.koohyom.in
  image:
    repository: traefik/whoami
    tag: v1.11
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80

ingress-nginx:
  enabled: true
  controller:
    ingressClass: nginx
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
    service:
      type: ClusterIP
    admissionWebhooks:
      enabled: true

cloudflare-tunnel:
  enabled: true
  cloudflare:
    tunnelName: colima-k8s-koohyomin
    tunnelId: 9b1820c5-3168-4638-a1f0-9fe1585eda94
    secretName: cloudflare-tunnel-credentials
    enableWarp: false
    ingress:
      - hostname: "*.koohyom.in"
        service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
  replicaCount: 2
  image:
    tag: "2026.2.0"

external-dns:
  enabled: true
  provider:
    name: cloudflare
  sources:
    - ingress
  domainFilters:
    - koohyom.in
  policy: sync
  registry: txt
  txtOwnerId: colima-k8s-koohyomin
  interval: 1m
  triggerLoopOnEvent: true
  managedRecordTypes:
    - CNAME
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-token
          key: api-token
  extraArgs:
    cloudflare-dns-records-per-page: "5000"
