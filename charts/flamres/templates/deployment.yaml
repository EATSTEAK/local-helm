apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flamres.fullname" . }}
  namespace: {{ include "flamres.namespace" . }}
  labels:
    {{- include "flamres.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flamres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flamres.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- if .Values.config }}
            - configMapRef:
                name: {{ .Values.configMap.name }}
            {{- end }}
            {{- if .Values.secretRef.enabled }}
            - secretRef:
                name: {{ .Values.secretRef.name }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.opencodeData.enabled .Values.persistence.workdir.enabled }}
          volumeMounts:
            {{- if .Values.persistence.opencodeData.enabled }}
            - name: {{ .Values.persistence.opencodeData.volumeName }}
              mountPath: {{ .Values.persistence.opencodeData.mountPath }}
            {{- end }}
            {{- if .Values.persistence.workdir.enabled }}
            - name: {{ .Values.persistence.workdir.volumeName }}
              mountPath: {{ .Values.persistence.workdir.mountPath }}
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.opencodeData.enabled .Values.persistence.workdir.enabled }}
      volumes:
        {{- if .Values.persistence.opencodeData.enabled }}
        - name: {{ .Values.persistence.opencodeData.volumeName }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.opencodeData.claimName }}
        {{- end }}
        {{- if .Values.persistence.workdir.enabled }}
        - name: {{ .Values.persistence.workdir.volumeName }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.workdir.claimName }}
        {{- end }}
      {{- end }}
