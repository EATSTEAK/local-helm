apiVersion: v1
kind: Service
metadata:
  name: grimmory
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: grimmory, app.kubernetes.io/component: app}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.host }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  selector: {app.kubernetes.io/name: grimmory, app.kubernetes.io/component: mariadb}
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
