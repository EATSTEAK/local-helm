namespace: default
image: {repository: ghcr.io/grimmory-tools/grimmory, tag: v3.2.4, pullPolicy: IfNotPresent}
timezone: UTC
database:
  host: grimmory-mariadb
  name: grimmory
  username: grimmory
  secretName: grimmory-db
  passwordKey: database-password
  rootPasswordKey: root-password
  image: {repository: lscr.io/linuxserver/mariadb, tag: 11.4.8, pullPolicy: IfNotPresent}
service: {port: 6060}
ingress: {enabled: false, className: nginx, host: "", annotations: {}}
resources: {app: {}, mariadb: {}}
persistence:
  storageClassName: local-path
  appData: {size: 2Gi}
  books: {size: 30Gi}
  bookdrop: {size: 5Gi}
  mariadb: {size: 5Gi}
translationSidecar:
  enabled: false
  image:
    repository: ghcr.io/eatsteak/grimmory-translation-sidecar
    tag: 0.1.0
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  secretName: grimmory-translator-runtime
  secretKey: LLM_API_KEY
  terminationGracePeriodSeconds: 60
  config:
    inputDir: /books/translations-original
    outputDir: /books/epub_kr
    stateDir: /books/.translation-sidecar
    llmBaseUrl: http://host.docker.internal:8317/v1
    llmModel: gpt-5.6-luna
    targetLanguage: ko
    singleTranslate: true
    planClassify: most
    translateTags: ""
    excludeTranslateTags: sup,code
    useContext: false
    temperature: ""
    parallelWorkers: 1
    prompt: ""
    extraBody: ""
    pollIntervalSeconds: 10
    stableAgeSeconds: 30
    jobTimeoutSeconds: 86400
    maxAttempts: 5
    retryBaseSeconds: 300
    retryMaxSeconds: 3600
    healthPort: 8081
    logLevel: INFO
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
