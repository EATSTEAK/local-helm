apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.passwordSecretName }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.runtimeSecret.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgresql://%s:%s@pnl-postgres:5432/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.database | quote }}
  EMAIL_INGEST_HMAC_SECRET: {{ .Values.runtimeSecret.emailIngestHmacSecret | quote }}
  DEBANK_API_KEY: {{ .Values.runtimeSecret.debankApiKey | quote }}
  CCXT_EXCHANGE_CREDENTIALS_JSON: {{ .Values.runtimeSecret.ccxtExchangeCredentialsJson | quote }}
