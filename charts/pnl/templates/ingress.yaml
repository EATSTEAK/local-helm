{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pnl
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pnl-api
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: pnl-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pnl-web
                port:
                  number: 80
{{- end }}

