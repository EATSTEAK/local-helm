apiVersion: batch/v1
kind: Job
metadata:
  name: pnl-migrate
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/0001_initial.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecretName }}
                  key: {{ .Values.database.urlSecretKey }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: pnl-migrations

