{{- if .Values.masterSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sake-api.fullname" . }}-seed-master-{{ .Release.Revision }}
  namespace: {{ include "sake-api.namespace" . }}
  labels:
    {{- include "sake-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: master-seed
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .Values.masterSeed.hookWeight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.masterSeed.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "sake-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: master-seed
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: seed-master
          image: "{{ .Values.image.repository }}:{{ required "sake-api image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            {{- range .Values.secretRefs }}
            - secretRef:
                name: {{ .name }}
                optional: {{ default false .optional }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              test -n "$DATABASE_URL"
              test -n "$SAKE_ADMIN_EMAIL"
              test -n "$SAKE_ADMIN_PASSWORD"
              node server/api/dist/auth/seed-master-account.js
{{- end }}
