{{- if .Values.crawl4ai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sake-deps.crawl4aiName" . }}
  namespace: {{ include "sake-deps.namespace" . }}
  labels:
    {{- include "sake-deps.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "sake-deps.crawl4aiName" . }}
    app.kubernetes.io/component: crawl4ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sake-deps.crawl4aiName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: crawl4ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sake-deps.crawl4aiName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: crawl4ai
    spec:
      containers:
        - name: crawl4ai
          image: "{{ .Values.crawl4ai.image.repository }}:{{ .Values.crawl4ai.image.tag }}{{ with .Values.crawl4ai.image.digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .Values.crawl4ai.image.pullPolicy }}
          env:
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "crawl4ai.auth.secretName is required" .Values.crawl4ai.auth.secretName }}
                  key: {{ required "crawl4ai.auth.secretKey is required" .Values.crawl4ai.auth.secretKey }}
                  optional: false
          ports:
            - name: http
              containerPort: {{ .Values.crawl4ai.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.crawl4ai.resources | nindent 12 }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.crawl4ai.shm.sizeLimit | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sake-deps.crawl4aiName" . }}
  namespace: {{ include "sake-deps.namespace" . }}
  labels:
    {{- include "sake-deps.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "sake-deps.crawl4aiName" . }}
    app.kubernetes.io/component: crawl4ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.crawl4ai.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "sake-deps.crawl4aiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: crawl4ai
{{- end }}
