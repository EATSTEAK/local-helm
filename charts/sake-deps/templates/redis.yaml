{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sake-deps.redisName" . }}
  namespace: {{ include "sake-deps.namespace" . }}
  labels:
    {{- include "sake-deps.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "sake-deps.redisName" . }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # A single Redis writer must own the data directory during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sake-deps.redisName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sake-deps.redisName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- if .Values.redis.persistence.enabled }}
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      {{- if .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.persistence.claimName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sake-deps.redisName" . }}
  namespace: {{ include "sake-deps.namespace" . }}
  labels:
    {{- include "sake-deps.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "sake-deps.redisName" . }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "sake-deps.redisName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
{{- end }}
