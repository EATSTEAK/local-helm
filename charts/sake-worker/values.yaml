namespace: ""
replicaCount: 1

image:
  repository: ghcr.io/triflam/sake-app
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

container:
  command:
    - node
    - apps/worker/dist/main.js

configMap:
  name: sake-worker-config

config:
  NODE_ENV: production
  WORKER_CONCURRENCY: "1"
  REDIS_URL: redis://sake-redis:6379
  MINIO_ENDPOINT: sake-minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: sake-dev
  OBJECT_STORE_ENDPOINT: sake-minio
  OBJECT_STORE_PORT: "9000"
  OBJECT_STORE_USE_SSL: "false"
  OBJECT_STORE_BUCKET: sake-dev
  PRODUCT_FILE_MAX_BYTES: "10485760"
  PRODUCT_FILE_MAX_COUNT: "10"
  LLM_BASE_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-5.5
  LLM_TIMEOUT_MS: "60000"
  LLM_MAX_RETRIES: "2"
  LLM_SUPPORTS_JSON_SCHEMA_OUTPUT: "true"
  EMBEDDING_BASE_URL: https://api.openai.com/v1
  EMBEDDING_MODEL: text-embedding-3-large
  EMBEDDING_DIMENSIONS: "1536"
  CRAWL4AI_BASE_URL: http://sake-crawl4ai:11235
  CRAWL4AI_TIMEOUT_MS: "30000"
  CRAWL4AI_MAX_RETRIES: "1"
  CRAWL4AI_USER_AGENT: sake-public-evidence/1.0
  PUBLIC_EVIDENCE_MAX_SOURCES: "20"
  PUBLIC_EVIDENCE_MAX_BYTES_PER_SOURCE: "1048576"
  PUBLIC_EVIDENCE_SEARCH_ENABLED: "false"
  RESEARCH_CRAWL_ENABLED: "false"
  RESEARCH_SEARCH_ENABLED: "false"
  RESEARCH_SEARCH_PROVIDER: none
  RESEARCH_MAX_SEARCH_RESULTS: "20"
  RESEARCH_MAX_CRAWL_SOURCES: "8"
  RESEARCH_MAX_BYTES_PER_SOURCE: "1048576"
  RESEARCH_MAX_ITERATIONS: "2"
  RESEARCH_MAX_TOOL_CONCURRENCY: "3"
  RESEARCH_MAX_WALL_TIME_MS: "120000"
  TAVILY_TIMEOUT_MS: "10000"
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: ""
  LANGSMITH_FULL_TRACE_MODE: "off"
  READINESS_TIMEOUT_MS: "3000"

secretRefs:
  - name: sake-dev-secrets
    optional: false
  - name: sake-runtime-secrets
    optional: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
