apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      {{- include "shared-postgres.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # Explicitly opt in each client Pod, including database bootstrap Jobs.
        - podSelector:
            matchLabels:
              shared-postgres-client: "true"
      ports:
        - {protocol: TCP, port: 5432}
  # PostgreSQL has no outbound dependencies; backup uses exec/local sockets.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-bootstrap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shared-postgres-bootstrap
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "shared-postgres.labels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
