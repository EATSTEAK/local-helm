# Colima profile for the local Kubernetes cluster.
# Copy to ~/.colima/default/colima.yaml or run `just colima-restart`.
cpu: 4
disk: 100
memory: 12
arch: aarch64
runtime: docker
hostname: colima

kubernetes:
  enabled: true
  version: v1.33.4+k3s1
  k3sArgs:
    - --disable=traefik
  port: 0

autoActivate: true

network:
  address: false
  mode: shared
  interface: en0
  preferredRoute: false
  dns: []
  dnsHosts: {}
  hostAddresses: false

docker:
  log-driver: json-file
  # Rotate below kubelet's 10Mi threshold; cri-dockerd cannot reopen logs.
  log-opts:
    max-size: "5m"
    max-file: "3"
  builder:
    gc:
      enabled: true
      defaultKeepStorage: "5GB"
vmType: vz
portForwarder: ssh
rosetta: false
binfmt: true
nestedVirtualization: false
mountType: virtiofs
mountInotify: true
forwardAgent: false

# K3s >= 1.32 loads this drop-in without replacing its default kubelet settings.
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      config_dir="/var/lib/rancher/k3s/agent/etc/kubelet.conf.d"
      mkdir -p "$config_dir"
      tmp="$(mktemp "$config_dir/.image-gc.XXXXXX")"
      trap 'rm -f "$tmp"' EXIT
      cat > "$tmp" <<'EOF'
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      imageMaximumGCAge: 24h
      EOF
      chmod 0644 "$tmp"
      mv -f "$tmp" "$config_dir/10-image-gc.conf"
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      config_dir="/etc/systemd/journald.conf.d"
      mkdir -p "$config_dir"
      tmp="$(mktemp "$config_dir/.retention.XXXXXX")"
      trap 'rm -f "$tmp"' EXIT
      cat > "$tmp" <<'EOF'
      [Journal]
      SystemMaxUse=1G
      SystemKeepFree=1G
      MaxRetentionSec=7day
      EOF
      chmod 0644 "$tmp"
      mv -f "$tmp" "$config_dir/60-local-helm-retention.conf"
      # journald is already running when Lima system provisioning executes.
      systemctl restart systemd-journald.service

sshConfig: true
sshPort: 0
mounts: []
diskImage: ""
rootDisk: 20
env: {}
