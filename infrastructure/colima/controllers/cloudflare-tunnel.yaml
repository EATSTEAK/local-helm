apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare-tunnel
spec:
  interval: 10m0s
  releaseName: cloudflare-tunnel
  targetNamespace: cloudflare-tunnel
  chart:
    spec:
      chart: ./charts/cloudflare-kube-tunnel
      interval: 10m0s
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    cloudflare-tunnel:
      enabled: true
      cloudflare:
        enableWarp: false
        ingress:
          - hostname: "*.koohyom.in"
            service: http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
        secretName: cloudflare-tunnel-credentials
        tunnelId: 9b1820c5-3168-4638-a1f0-9fe1585eda94
        tunnelName: colima-k8s-koohyomin
      image:
        tag: 2026.2.0
      replicaCount: 2
