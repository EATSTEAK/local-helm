apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 10m0s
  releaseName: external-dns
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      interval: 10m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      version: 1.20.0
  values:
    domainFilters:
      - koohyom.in
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            key: api-token
            name: cloudflare-api-token
    extraArgs:
      cloudflare-dns-records-per-page: "5000"
    interval: 1m
    managedRecordTypes:
      - CNAME
    policy: sync
    provider:
      name: cloudflare
    registry: txt
    sources:
      - ingress
    triggerLoopOnEvent: true
    txtOwnerId: colima-k8s-koohyomin
